<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Github</title>
    <script>
        const URL="https://dummyjson.com/products?limit=10&skip=2"
        const RATEURL ="https://v6.exchangerate-api.com/v6/dcae9c79e69985006954f939/pair/USD/INR"
        async function loadProduct(){
            try{
                let cart = []
                let items=[]
                function addItem(idx,item){
                    cart.push(idx)
                    items.push(item)
                    console.log(cart)
                }
                window.addItem = addItem;
                function placeOrder(){
                    let totalPrice=0;
                    for(let i=0;i<cart.length;i++){
                        totalPrice+=cart[i]
                    }
                    const y = document.getElementsByClassName("produc")[0]
                    const h2 = document.createElement("list")
                    for(let i=0;i<items.lengt;i++){
                        h2.innerHTML=items[i];
                    }
                    y.appendChild(h2)
                    const x = document.getElementsByClassName("order")[0]
                    const h1 = document.createElement("h1")
                    h1.innerHTML=`Total Price: ₹${totalPrice.toFixed(2)}`;
                    x.appendChild(h1)
                    console.log(totalPrice)
                }
                window.placeOrder = placeOrder;

                const result =await fetch(URL);
                const Rate =await fetch(RATEURL);
                const rateData = await Rate.json();
                console.log(rateData);
                const CurrentRate = (rateData.conversion_rate);
                const response = await result.json();
                // console.log("result",response)
                const tbody = document.querySelector("tbody");
                response.products.map((product,idx)=>{
                    const tr = document.createElement("tr");
                    tr.innerHTML = `<td>${idx+1}</td>
                    <td>${product.title}</td>
                    <td>${product.category}</td>
                    <td>&#x20B9;${(product.price*CurrentRate).toFixed(2)}</td>
                    <td>${product.rating}</td>
                    <td><img src="${product.thumbnail}" width="80"></td>
                    <td><button onclick="addItem(${product.price * CurrentRate,product.title})">add to cart</button></td>
                    `;
                    tbody.appendChild(tr);
                })
            }catch(err){
                console.log(err)
            }
        }
        loadProduct()
    </script>
    <style>
        table{
            margin:auto;
            background-color: antiquewhite;
            
        }
        .heading{
            /* color:rgb(121, 25, 204) */
            background-color:aqua;
        }
        .feild{
            margin:auto;
        }
    </style>
</head>
<body>
    <table border="black">
        <thead class="heading">
            <tr >
                <th>Sr.No</th>
                <th>Title</th>
                <th>Category</th>
                <th>Price </th>
                <th>Rating</th>
                <th>Photo</th>
                <th>Choose</th>
            </tr>
        </thead>
        <tbody style="text-align: center;">

        </tbody>
    </table>
    <div class="order"></div>
    <div class="produc"></div>
    <button onclick="placeOrder()">place order</button>
</body>
</html>
